<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hawthorne-Scribner High School – Chat with fellow students." />
  <title>Chat | Hawthorne-Scribner High School</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function() {
      const t = localStorage.getItem('hshs-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">HS</span>
        <span class="logo-text">
          <span class="logo-name">Hawthorne-Scribner</span>
          <span class="logo-sub">Academics Door</span>
        </span>
      </a>
      <nav class="nav" id="mainNav">
        <a href="index.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Home</span></a>
        <a href="index.html#papers" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="nav-label">Past Papers</span></a>
        <a href="index.html#notes" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label">Notes</span></a>
        <a href="index.html#subjects" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="nav-label">Subjects</span></a>
        <a href="community.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span class="nav-label">Community</span></a>
        <a href="comments.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="nav-label">Comments</span></a>
        <a href="chat.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="nav-label">Chat</span></a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
          <span class="icon-sun">☀</span>
          <span class="icon-moon">☾</span>
        </button>
        <button class="btn btn-outline">Login</button>
        <button class="btn btn-primary">Sign Up</button>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <div class="chat-page" id="chatPage">
    <aside class="chat-sidebar" id="chatSidebar">
      <div class="chat-sidebar-header">
        <h2>Messages</h2>
        <button class="btn btn-ghost btn-sm" id="newChatBtn" title="New chat">＋</button>
      </div>
      <div class="chat-search">
        <input type="search" id="chatSearch" placeholder="Search conversations..." autocomplete="off" />
      </div>
      <div class="conversations" id="conversationsList"></div>
    </aside>
    <main class="chat-main" id="chatMain">
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-icon">💬</div>
        <h3>Your messages</h3>
        <p>Select a conversation or start a new one to chat with fellow Hawthorne-Scribner students.</p>
      </div>
      <div id="activeChat" style="display: none; flex-direction: column; height: 100%;">
        <div class="chat-main-header" id="chatHeader">
          <img class="conv-avatar" id="activeAvatarImg" src="" alt="" style="display:none" />
          <div class="conv-avatar-fallback" id="activeAvatar">A</div>
          <div>
            <h3 id="activeName">Student</h3>
            <div class="status" id="activeStatus">Online</div>
          </div>
        </div>
        <div class="messages" id="messagesContainer"></div>
        <div class="chat-input-bar">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
          <button class="chat-send-btn" id="sendBtn" aria-label="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function() {
      function avatarUrl(name) {
        return "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=4f46e5&color=fff&size=96&bold=true&format=svg";
      }
      const conversations = [
        { id: 1, name: "Amina K.", avatar: "A", pic: avatarUrl("Amina K"), preview: "Thanks for the Maths notes!", time: "2m", unread: 2, status: "Online",
          messages: [
            { text: "Hey! Do you have the Form 4 Maths Paper 1?", sent: false, time: "10:12" },
            { text: "Yes, I just uploaded it yesterday.", sent: true, time: "10:14" },
            { text: "Thanks for the Maths notes!", sent: false, time: "10:15" }
          ]},
        { id: 2, name: "Brian O.", avatar: "B", pic: avatarUrl("Brian O"), preview: "Physics group study at 4pm?", time: "25m", unread: 0, status: "Online",
          messages: [
            { text: "Physics group study at 4pm?", sent: false, time: "09:50" },
            { text: "Count me in! Library or classroom?", sent: true, time: "09:52" }
          ]},
        { id: 3, name: "Faith W.", avatar: "F", pic: avatarUrl("Faith W"), preview: "The Biology notes are fire 🔥", time: "1h", unread: 1, status: "Away",
          messages: [{ text: "The Biology notes are fire 🔥", sent: false, time: "08:40" }]},
        { id: 4, name: "Study Group – Chem", avatar: "C", pic: avatarUrl("Chem Group"), preview: "Someone share the organic chem summary", time: "3h", unread: 0, status: "3 members",
          messages: [
            { text: "Someone share the organic chem summary", sent: false, time: "07:15" },
            { text: "I have it, sending now.", sent: true, time: "07:18" }
          ]},
        { id: 5, name: "Daniel M.", avatar: "D", pic: avatarUrl("Daniel M"), preview: "Good luck with the exams!", time: "Yesterday", unread: 0, status: "Offline",
          messages: [
            { text: "How are the revisions going?", sent: true, time: "Yesterday" },
            { text: "Good luck with the exams!", sent: false, time: "Yesterday" }
          ]}
      ];
      let activeId = null;

      function renderConversations(filter = "") {
        const list = document.getElementById("conversationsList");
        if (!list) return;
        const filtered = conversations.filter(c =>
          c.name.toLowerCase().includes(filter.toLowerCase()) ||
          c.preview.toLowerCase().includes(filter.toLowerCase())
        );
        list.innerHTML = filtered.map(c => `
          <div class="conversation-item ${c.id === activeId ? 'active' : ''}" data-id="${c.id}">
            <img class="conv-avatar" src="${c.pic}" alt="${c.name}" width="48" height="48" />
            <div class="conv-info">
              <div class="conv-name">${c.name}</div>
              <div class="conv-preview">${c.preview}</div>
            </div>
            <div class="conv-meta">
              <div class="conv-time">${c.time}</div>
              ${c.unread ? `<span class="conv-unread">${c.unread}</span>` : ''}
            </div>
          </div>
        `).join("");
        list.querySelectorAll(".conversation-item").forEach(el => {
          el.addEventListener("click", () => openConversation(+el.dataset.id));
        });
      }

      function openConversation(id) {
        activeId = id;
        const conv = conversations.find(c => c.id === id);
        if (!conv) return;
        document.getElementById("chatEmpty").style.display = "none";
        document.getElementById("activeChat").style.display = "flex";
        const img = document.getElementById("activeAvatarImg");
        const fb = document.getElementById("activeAvatar");
        img.src = conv.pic;
        img.alt = conv.name;
        img.style.display = "block";
        fb.style.display = "none";
        document.getElementById("activeName").textContent = conv.name;
        document.getElementById("activeStatus").textContent = conv.status;
        const container = document.getElementById("messagesContainer");
        container.innerHTML = conv.messages.map(m => `
          <div class="message ${m.sent ? 'sent' : 'received'}">
            ${m.text}
            <div class="msg-time">${m.time}</div>
          </div>
        `).join("");
        container.scrollTop = container.scrollHeight;
        conv.unread = 0;
        renderConversations(document.getElementById("chatSearch")?.value || "");
        document.getElementById("chatSidebar")?.classList.remove("open");
      }

      function sendMessage() {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if (!text || !activeId) return;
        const conv = conversations.find(c => c.id === activeId);
        if (!conv) return;
        const now = new Date();
        const time = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
        conv.messages.push({ text, sent: true, time });
        conv.preview = text;
        conv.time = "Just now";
        input.value = "";
        openConversation(activeId);
      }

      document.getElementById("chatSearch")?.addEventListener("input", e => renderConversations(e.target.value));
      document.getElementById("sendBtn")?.addEventListener("click", sendMessage);
      document.getElementById("messageInput")?.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });
      renderConversations();
      if (window.innerWidth > 900 && conversations.length) openConversation(conversations[0].id);
    })();
  </script>
</body>
</html>
